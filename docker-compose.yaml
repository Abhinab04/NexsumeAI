services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: nexsume-backend

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env

    networks:
      - nexsume-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: nexsume-frontend

    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend

    networks:
      - nexsume-network


networks:
  nexsume-network:
    driver: bridge